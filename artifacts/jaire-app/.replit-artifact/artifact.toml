kind = "web"
previewPath = "/"
title = "JaIre — Web3 Coworking"
version = "1.0.0"
id = "artifacts/jaire-app"
router = "path"

[[integratedSkills]]
name = "react-vite"
version = "1.0.0"

[[services]]
name = "web"
paths = [ "/" ]
localPort = 24196

[services.development]
run = "pnpm --filter @workspace/jaire-app run dev"

[services.production]
build = [ "pnpm", "--filter", "@workspace/jaire-app", "run", "build" ]
publicDir = "artifacts/jaire-app/dist/public"
serve = "static"

[[services.production.rewrites]]
from = "/*"
to = "/index.html"

[services.env]
PORT = "24196"
BASE_PATH = "/"
