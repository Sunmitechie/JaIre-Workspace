<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1" />
    <title>JaIre — Web3 Coworking</title>
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@300;400;500;600;700&family=Space+Mono:ital,wght@0,400;0,700;1,400&display=swap" rel="stylesheet">
    <script>
      // This classic (non-module) script runs before any ESM module code.
      // It ensures `process` and `process.env` are defined before Web3Auth's
      // transitive deps (e.g. util@0.12.5, readable-stream) try to access them.
      (function () {
        if (typeof globalThis.process === 'undefined') {
          globalThis.process = {};
        }
        var p = globalThis.process;
        if (!p.env) p.env = {};
        if (!p.env.NODE_ENV) p.env.NODE_ENV = 'development';
        p.NODE_DEBUG = p.NODE_DEBUG || false;
        p.version = p.version || '';
        p.versions = p.versions || {};
        p.platform = p.platform || 'browser';
        p.browser = true;
        if (typeof p.nextTick !== 'function') {
          p.nextTick = function (fn) {
            var args = Array.prototype.slice.call(arguments, 1);
            Promise.resolve().then(function () { fn.apply(null, args); });
          };
        }
      }());
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
