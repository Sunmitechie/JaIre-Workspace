[package]
name = "jaire-escrow"
version = "0.1.0"
description = "JaIre coworking escrow: check-in/out with USDC streaming and yield"
edition = "2021"

[lib]
crate-type = ["cdylib", "lib"]
name = "jaire_escrow"

[features]
no-entrypoint = []
no-idl = []
no-log-ix-name = []
cpi = ["no-entrypoint"]
default = []

[dependencies]
anchor-lang = { version = "0.31.0", features = ["init-if-needed"] }
anchor-spl = { version = "0.31.0", features = ["token"] }
